[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-qualification"
version = "0.4.0"
description = "Compare PyTorch, ONNX Runtime, INT8, and CUDA inference backends"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.17",
  "onnxscript>=0.4",
  "torch>=2.9,<3",
]

[project.scripts]
inferqual = "inferqual.cli:main"

[tool.setuptools.packages.find]
include = ["inferqual*"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
